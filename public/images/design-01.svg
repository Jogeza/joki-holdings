<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="16" fill="#075B59"/>
  <circle cx="700" cy="100" r="180" fill="#FFC800" fill-opacity="0.15"/>
  <circle cx="100" cy="500" r="220" fill="#0E3B3A" fill-opacity="0.6"/>
  
  <!-- Identity Showcase Elements -->
  <g transform="translate(100, 80)">
    <!-- Palette swatches -->
    <rect x="40" y="40" width="140" height="190" rx="12" fill="#FFFFFF" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.25))"/>
    <rect x="52" y="52" width="116" height="90" rx="8" fill="#075B59"/>
    <text x="54" y="165" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#1F1F1F">JOKI TEAL</text>
    <text x="54" y="185" font-family="'Montserrat', sans-serif" font-size="11" fill="#666666">HEX #075B59</text>
    <text x="54" y="202" font-family="'Montserrat', sans-serif" font-size="10" fill="#999999">PANTONE 3298 C</text>

    <!-- Brand Card 2 -->
    <rect x="210" y="70" width="280" height="180" rx="14" fill="#FFFFFF" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.3))"/>
    <rect x="230" y="90" width="48" height="48" rx="10" fill="#FFC800"/>
    <text x="290" y="112" font-family="'Montserrat', sans-serif" font-weight="800" font-size="18" fill="#1F1F1F">Brand Guidelines</text>
    <text x="290" y="130" font-family="'Montserrat', sans-serif" font-size="12" fill="#666666">Typography, Grid &amp; Identity</text>
    <rect x="230" y="155" width="240" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="230" y="170" width="180" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="230" y="185" width="210" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="230" y="210" width="80" height="24" rx="12" fill="#075B59"/>
    <text x="248" y="226" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF">ACTIVE</text>

    <!-- Typography Specs -->
    <rect x="120" y="260" width="370" height="140" rx="12" fill="#1F1F1F" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.4))"/>
    <text x="145" y="300" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" fill="#FFC800">Aa Bb Gg 123</text>
    <text x="145" y="330" font-family="'Montserrat', sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" fill-opacity="0.8">Montserrat Bold &amp; Poppins Regular</text>
    <text x="145" y="355" font-family="'Montserrat', sans-serif" font-weight="400" font-size="11" fill="#999999">The quick brown fox jumps over the lazy dog</text>

    <!-- Geometry Accents -->
    <circle cx="520" cy="180" r="16" fill="#FFC800"/>
    <rect x="490" y="220" width="32" height="32" rx="8" stroke="#FFC800" stroke-width="2" fill="none"/>
  </g>
</svg>
