        <text x="15" y="65" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#1F1F1F">E-Commerce</text>
        <rect x="15" y="75" width="140" height="4" rx="2" fill="#CBD5E1"/>

        <rect x="215" y="0" width="195" height="100" rx="8" fill="#F8F6F2"/>
        <rect x="230" y="15" width="28" height="28" rx="6" fill="#FFC800"/>
        <text x="230" y="65" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#1F1F1F">Web Apps</text>
        <rect x="230" y="75" width="140" height="4" rx="2" fill="#CBD5E1"/>
