    <!-- Browser Stack Mockup -->
    <g transform="translate(10, 160)">
      <rect x="0" y="0" width="460" height="320" rx="14" fill="#FFFFFF" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.5))"/>
      
      <!-- Topbar -->
      <rect x="0" y="0" width="460" height="36" rx="14 14 0 0" fill="#1F1F1F"/>
      <circle cx="18" cy="18" r="5" fill="#EF4444"/>
      <circle cx="32" cy="18" r="5" fill="#F59E0B"/>
      <circle cx="46" cy="18" r="5" fill="#10B981"/>
      <rect x="80" y="8" width="220" height="20" rx="10" fill="#333333"/>
      <text x="95" y="22" font-family="'Poppins', sans-serif" font-size="9" fill="#999999">https://www.jokiholdings.com</text>

      <!-- Web Content -->
      <rect x="25" y="55" width="410" height="120" rx="8" fill="#075B59"/>
      <text x="45" y="95" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">Digital First</text>
      <text x="45" y="115" font-family="'Poppins', sans-serif" font-size="11" fill="#E2E8F0">Responsive, lightning fast, and secure.</text>
      <rect x="45" y="130" width="90" height="26" rx="13" fill="#FFC800"/>
      <text x="90" y="147" font-family="'Montserrat', sans-serif" font-weight="800" font-size="10" fill="#1F1F1F" text-anchor="middle">LAUNCH</text>

      <!-- 2 Columns -->
      <g transform="translate(25, 195)">
        <rect x="0" y="0" width="195" height="100" rx="8" fill="#F8F6F2"/>
