<svg width="600" height="700" viewBox="0 0 600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="700" rx="20" fill="#0E3B3A"/>
  <circle cx="500" cy="150" r="150" fill="#FFC800" fill-opacity="0.2"/>
  <circle cx="100" cy="600" r="160" fill="#075B59" fill-opacity="0.5"/>
  
  <g transform="translate(60, 60)">
    <text x="0" y="40" font-family="'Montserrat', sans-serif" font-weight="900" font-size="14" fill="#FFC800" letter-spacing="2">03 / DIGITAL EXPERIENCES</text>
    <text x="0" y="85" font-family="'Montserrat', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">WEB</text>
