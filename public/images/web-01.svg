<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="16" fill="#075B59"/>
  <circle cx="150" cy="150" r="160" fill="#FFC800" fill-opacity="0.15"/>
  <circle cx="700" cy="450" r="220" fill="#0E3B3A" fill-opacity="0.6"/>

  <!-- Corporate Web Platform Mockup -->
  <g transform="translate(100, 70)">
    <!-- Browser Window Container -->
    <rect x="0" y="0" width="600" height="420" rx="14" fill="#FFFFFF" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.45))"/>
    
    <!-- Browser Titlebar -->
    <rect x="0" y="0" width="600" height="44" rx="14 14 0 0" fill="#1F1F1F"/>
    <circle cx="24" cy="22" r="6" fill="#EF4444"/>
    <circle cx="42" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="22" r="6" fill="#10B981"/>
    <rect x="100" y="10" width="340" height="24" rx="12" fill="#333333"/>
    <text x="120" y="26" font-family="'Poppins', sans-serif" font-size="11" fill="#999999">https://www.corporate-client.com</text>

    <!-- Web Page Hero Section -->
    <rect x="40" y="70" width="520" height="150" rx="10" fill="#075B59"/>
    <text x="70" y="115" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">Transform Your Business</text>
    <text x="70" y="140" font-family="'Poppins', sans-serif" font-size="12" fill="#E2E8F0">Modern, scalable and conversion-driven web architectures.</text>
    <rect x="70" y="160" width="110" height="34" rx="6" fill="#FFC800"/>
    <text x="125" y="182" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#1F1F1F" text-anchor="middle">GET STARTED</text>

    <!-- Web 3-Column Features -->
    <g transform="translate(40, 245)">
      <rect x="0" y="0" width="160" height="135" rx="8" fill="#F8F6F2" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="15" y="15" width="36" height="36" rx="6" fill="#075B59"/>
      <text x="15" y="75" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#1F1F1F">Ultra Fast</text>
      <rect x="15" y="90" width="130" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="15" y="102" width="90" height="5" rx="2" fill="#CBD5E1"/>

      <rect x="180" y="0" width="160" height="135" rx="8" fill="#F8F6F2" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="195" y="15" width="36" height="36" rx="6" fill="#FFC800"/>
      <text x="195" y="75" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#1F1F1F">SEO Ready</text>
      <rect x="195" y="90" width="130" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="195" y="102" width="100" height="5" rx="2" fill="#CBD5E1"/>

      <rect x="360" y="0" width="160" height="135" rx="8" fill="#F8F6F2" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="375" y="15" width="36" height="36" rx="6" fill="#1F1F1F"/>
      <text x="375" y="75" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#1F1F1F">Responsive</text>
      <rect x="375" y="90" width="130" height="5" rx="2" fill="#CBD5E1"/>
      <rect x="375" y="102" width="110" height="5" rx="2" fill="#CBD5E1"/>
    </g>
  </g>
</svg>
