<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="16" fill="#1F1F1F"/>
  <circle cx="200" cy="150" r="140" fill="#075B59" fill-opacity="0.2"/>
  <circle cx="650" cy="450" r="200" fill="#FFC800" fill-opacity="0.1"/>

  <!-- Marketing & Packaging Mockup -->
  <g transform="translate(120, 80)">
    <!-- Box Packaging Mockup -->
    <rect x="60" y="80" width="220" height="280" rx="16" fill="#075B59" stroke="#FFC800" stroke-width="2" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.5))"/>
    <rect x="90" y="120" width="160" height="60" rx="8" fill="#FFC800"/>
    <text x="110" y="157" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#1F1F1F">PREMIUM</text>
    <text x="90" y="215" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Eco-Friendly Craft</text>
    <text x="90" y="235" font-family="'Poppins', sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.7">Matte UV Soft Touch</text>
    <circle cx="170" cy="290" r="28" fill="#0E3B3A"/>
    <text x="156" y="296" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#FFC800">100%</text>

    <!-- Brochure Mockup -->
    <g transform="translate(240, 40)">
      <rect x="0" y="0" width="260" height="340" rx="14" fill="#F8F6F2" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.4))"/>
      <rect x="25" y="25" width="210" height="130" rx="8" fill="#075B59"/>
      <rect x="40" y="45" width="80" height="12" rx="4" fill="#FFC800"/>
      <text x="40" y="90" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Campaign</text>
      <text x="40" y="110" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Lookbook</text>
      
      <rect x="25" y="175" width="210" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="25" y="195" width="160" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="25" y="215" width="190" height="8" rx="4" fill="#CBD5E1"/>
      
      <rect x="25" y="250" width="100" height="30" rx="15" fill="#1F1F1F"/>
      <text x="42" y="270" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#FFC800">COLLECTION</text>
    </g>
  </g>
