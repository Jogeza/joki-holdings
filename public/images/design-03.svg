<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="16" fill="#F8F6F2"/>
  <circle cx="650" cy="150" r="160" fill="#075B59" fill-opacity="0.08"/>
  <circle cx="150" cy="450" r="180" fill="#FFC800" fill-opacity="0.15"/>

  <!-- Social & Digital Campaign Artworks -->
  <g transform="translate(120, 80)">
    <!-- Main Square Post -->
    <rect x="0" y="20" width="320" height="320" rx="20" fill="#075B59" filter="drop-shadow(0 20px 40px rgba(7,91,89,0.25))"/>
    <circle cx="160" cy="130" r="60" fill="#FFC800"/>
    <text x="160" y="138" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#1F1F1F" text-anchor="middle">NEW</text>
    <text x="160" y="220" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle">SUMMER DROP</text>
    <text x="160" y="245" font-family="'Poppins', sans-serif" font-weight="400" font-size="12" fill="#F8F6F2" fill-opacity="0.8" text-anchor="middle">Exclusive Collection Available Now</text>
    <rect x="110" y="265" width="100" height="32" rx="16" fill="#FFFFFF"/>
    <text x="160" y="285" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#075B59" text-anchor="middle">SHOP NOW</text>

    <!-- Side Mobile Story Mockup -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="180" height="360" rx="24" fill="#1F1F1F" stroke="#333333" stroke-width="4" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.2))"/>
      <rect x="15" y="40" width="150" height="260" rx="12" fill="#0E3B3A"/>
