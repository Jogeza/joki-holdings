      <text x="90" y="125" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#1F1F1F" text-anchor="middle">STORIES</text>
      <text x="90" y="210" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Swipe Up</text>
      <path d="M90 230 L85 240 L95 240 Z" fill="#FFC800"/>
    </g>
