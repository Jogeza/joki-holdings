<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="16" fill="#1F1F1F"/>
  <circle cx="650" cy="450" r="200" fill="#075B59" fill-opacity="0.3"/>

  <!-- E-Commerce Storefront & Mobile View -->
  <g transform="translate(80, 60)">
    <!-- Desktop Storefront -->
    <rect x="0" y="0" width="450" height="420" rx="14" fill="#FFFFFF" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.5))"/>
    
    <!-- Navbar -->
    <rect x="0" y="0" width="450" height="48" rx="14 14 0 0" fill="#075B59"/>
    <text x="30" y="30" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" fill="#FFC800">STORE.UG</text>
    <rect x="340" y="14" width="80" height="22" rx="11" fill="#FFC800"/>
    <text x="380" y="29" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#1F1F1F" text-anchor="middle">CART (3)</text>

    <!-- Product Grid -->
    <g transform="translate(30, 70)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="180" height="150" rx="8" fill="#F8F6F2"/>
      <rect x="20" y="20" width="140" height="80" rx="6" fill="#075B59"/>
      <text x="10" y="120" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#1F1F1F">Leather Bag</text>
      <text x="10" y="138" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#075B59">UGX 180,000</text>

      <!-- Item 2 -->
      <rect x="210" y="0" width="180" height="150" rx="8" fill="#F8F6F2"/>
      <rect x="230" y="20" width="140" height="80" rx="6" fill="#FFC800"/>
      <text x="220" y="120" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#1F1F1F">Sneakers Pro</text>
      <text x="220" y="138" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#075B59">UGX 250,000</text>

      <!-- Checkout Banner -->
      <rect x="0" y="170" width="390" height="130" rx="10" fill="#0E3B3A"/>
      <text x="25" y="210" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Integrated Mobile Money</text>
      <text x="25" y="235" font-family="'Poppins', sans-serif" font-size="11" fill="#E2E8F0">MTN MoMo &amp; Airtel Money Checkout</text>
      <rect x="25" y="255" width="120" height="28" rx="14" fill="#FFC800"/>
      <text x="85" y="273" font-family="'Montserrat', sans-serif" font-weight="800" font-size="10" fill="#1F1F1F" text-anchor="middle">INSTANT PAY</text>
    </g>

    <!-- Mobile Device Mockup Side -->
    <g transform="translate(480, 40)">
      <rect x="0" y="0" width="170" height="340" rx="24" fill="#075B59" stroke="#333333" stroke-width="4" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.6))"/>
      <rect x="15" y="35" width="140" height="260" rx="12" fill="#FFFFFF"/>
      <rect x="25" y="50" width="120" height="50" rx="6" fill="#FFC800"/>
      <text x="85" y="80" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#1F1F1F" text-anchor="middle">MOBILE 1st</text>
      <rect x="25" y="115" width="120" height="60" rx="6" fill="#F8F6F2"/>
      <rect x="25" y="185" width="120" height="30" rx="15" fill="#075B59"/>
      <text x="85" y="204" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle">Checkout</text>
    </g>
  </g>
</svg>
